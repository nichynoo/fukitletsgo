<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recipe — FUKITLETSGO</title>
<link rel="icon" href="../logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Nunito:wght@400;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="recipes.css">
<style id="flg-nav-css">
:root{

  --bitumen:#18293a;        /* deep strait ink */
  --mist:#eaf0f3;           /* sea-mist background */
  --card:#ffffff;
  --sign-green:#0f7fa6;     /* sea blue primary */
  --sign-green-deep:#0a2e42;/* deep water */
  --gold:#d3a45c;           /* sand */
  --river:#34688f;          /* denim blue */
  --strait:#14283c;         /* Bass Strait navy */
  --line:#ccd8de;
  --muted:#5f7280;
  --bg:var(--mist); --bg2:#dfeaef; --surface:var(--card); --surface-hi:#f8f1e0;
  --line-soft:var(--line); --frost:var(--bitumen); --dim:var(--muted); --faint:#8fa3ad;
  --ember:var(--gold); --ember-deep:#a97a37;
  --glacier:var(--sign-green); --aurora:#3a8f7d; --dusk:#7d6ba0; --honey:var(--gold); --slate:#7f93a0;
  --rose:#c2563b; --copper:#b76b32; --sage:#698b50; --lemon:#c59d2e; --orchid:#9b5aa7; --cycle:#3a8f7d; --cold:var(--sign-green); --warm:var(--gold);
  --r:12px;
  --serif:'Barlow Condensed',system-ui,sans-serif;
  --sans:'Barlow',system-ui,-apple-system,sans-serif;
  --mono:'Barlow Condensed',system-ui,sans-serif;
}
html[data-theme="dark"]{

  --bitumen:#eaf0f3;
  --mist:#0d1721;
  --card:#14283c;
  --sign-green:#42a9cc;
  --sign-green-deep:#08111a;
  --gold:#d3a45c;
  --river:#7db8d7;
  --strait:#0a1320;
  --line:#294256;
  --muted:#a8bac7;
  --bg:var(--mist); --bg2:#102235; --surface:var(--card); --surface-hi:#193550;
  --line-soft:var(--line); --frost:var(--bitumen); --dim:var(--muted); --faint:#7f93a0;
  --ember:var(--gold); --ember-deep:#b7843c;
  --glacier:var(--sign-green); --aurora:#6ec2a7; --dusk:#b19ddb; --honey:var(--gold); --slate:#91a8b8;
  --rose:#ee8d73; --copper:#d98950; --sage:#9ab878; --lemon:#e0bd4d; --orchid:#ce85dd; --cycle:#6ec2a7; --cold:var(--sign-green); --warm:var(--gold);
  --r:12px;
  --serif:'Barlow Condensed',system-ui,sans-serif;
  --sans:'Barlow',system-ui,-apple-system,sans-serif;
  --mono:'Barlow Condensed',system-ui,sans-serif;
}
*{box-sizing:border-box; margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg); color:var(--frost); font-family:var(--sans); font-size:15px; line-height:1.5; -webkit-text-size-adjust:100%}

/* masthead */
.mast{position:relative; padding:30px 18px 22px; border-bottom:1px solid var(--line-soft); overflow:hidden}
.mast .aur{position:absolute; inset:0; background:radial-gradient(60% 80% at 25% 0%, rgba(127,201,160,.12), transparent 60%),radial-gradient(50% 80% at 80% 10%, rgba(167,143,214,.10), transparent 60%); pointer-events:none}
.eyebrow{font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--faint)}
h1{font-family:var(--serif); font-weight:600; font-size:clamp(30px,7vw,46px); line-height:1; margin-top:8px; letter-spacing:.005em}
h1 .go{color:var(--ember)}
.sub{color:var(--dim); margin-top:12px; max-width:60ch; font-size:14px}
.legd{display:flex; gap:16px; margin-top:14px; flex-wrap:wrap; font-family:var(--mono); font-size:11px; letter-spacing:.04em; color:var(--dim)}
.legd span{display:inline-flex; align-items:center; gap:6px}
.legd i{width:10px; height:10px; border-radius:3px; display:inline-block}

.themebtn{position:absolute; top:18px; right:16px; z-index:4; appearance:none; border:1px solid var(--line-soft); background:var(--surface); color:var(--frost); border-radius:999px; padding:7px 13px; font-family:var(--mono); font-size:11px; letter-spacing:.06em; cursor:pointer}
.themebtn:hover{border-color:var(--glacier)}

/* overall progress */
.overall{max-width:860px; margin:18px auto 0; padding:0 18px}
.bar{height:8px; background:var(--surface); border-radius:999px; overflow:hidden; border:1px solid var(--line-soft)}
.bar > i{display:block; height:100%; background:linear-gradient(90deg,var(--ember),var(--honey)); width:0; transition:width .35s ease}
.overall .lab{display:flex; justify-content:space-between; font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--dim); margin:8px 2px 0}

/* toolbar */
.tools{max-width:860px; margin:16px auto 0; padding:0 18px; display:flex; gap:8px; flex-wrap:wrap}
.tbtn{appearance:none; border:1px solid var(--line-soft); background:var(--surface); color:var(--dim); font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; padding:9px 13px; border-radius:999px; cursor:pointer}
.tbtn:hover{border-color:var(--glacier); color:var(--frost)}

/* sections */
.wrap{max-width:860px; margin:0 auto; padding:10px 18px 80px}
.sec{margin-top:26px; background:var(--bg2); border:1px solid var(--line-soft); border-radius:var(--r); overflow:hidden}
.sec > h2{font-family:var(--serif); font-weight:600; font-size:21px; padding:16px 18px 4px; display:flex; align-items:center; gap:10px}
.sec .scount{font-family:var(--mono); font-size:11px; color:var(--faint); font-weight:400; letter-spacing:.04em; margin-left:auto}
.sec .sbar{height:4px; background:var(--surface); margin:8px 18px 6px; border-radius:999px; overflow:hidden}
.sec .sbar > i{display:block; height:100%; background:var(--glacier); width:0; transition:width .3s ease}
.grp{padding:6px 0 12px}
.grp h3{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--faint); padding:12px 18px 6px; display:flex; align-items:center; gap:8px}
.grp h3.cold{color:var(--cold)} .grp h3.warm{color:var(--warm)}
ul{list-style:none}
li{display:flex; align-items:flex-start; gap:12px; padding:9px 18px; border-top:1px solid var(--line-soft); cursor:pointer; transition:background .12s}
li:hover{background:var(--surface)}
li .box{flex:0 0 auto; width:21px; height:21px; border:2px solid var(--line); border-radius:6px; margin-top:1px; display:grid; place-items:center; transition:all .15s}
li .box svg{width:13px; height:13px; stroke:var(--bg); stroke-width:3.5; fill:none; opacity:0; transform:scale(.4); transition:all .15s}
li.done .box{background:var(--aurora); border-color:var(--aurora)}
li.done .box svg{opacity:1; transform:scale(1)}
li .txt{flex:1; min-width:0}
li .name{transition:color .15s}
li.done .name{color:var(--faint); text-decoration:line-through}
li .qty{font-family:var(--mono); font-size:11px; color:var(--ember); margin-left:8px; white-space:nowrap}
li.done .qty{color:var(--faint)}
li .note{display:block; font-size:12px; color:var(--faint); margin-top:2px}
li .del{flex:0 0 auto; appearance:none; background:none; border:none; color:var(--faint); font-size:18px; line-height:1; cursor:pointer; padding:0 2px; opacity:0; transition:opacity .12s}
li:hover .del{opacity:.7}
li .del:hover{color:var(--ember); opacity:1}
.additem{display:flex; gap:8px; padding:11px 18px; border-top:1px dashed var(--line)}
.additem input{flex:1; background:var(--surface); border:1px solid var(--line-soft); color:var(--frost); border-radius:8px; padding:9px 11px; font-family:var(--sans); font-size:14px}
.additem input:focus{outline:none; border-color:var(--glacier)}
.additem button{appearance:none; border:1px solid var(--ember); background:transparent; color:var(--ember); font-family:var(--mono); font-size:12px; padding:0 14px; border-radius:8px; cursor:pointer}
.additem button:hover{background:var(--ember); color:var(--bg)}

footer{max-width:860px; margin:0 auto; padding:0 18px 60px; color:var(--faint); font-family:var(--mono); font-size:11px; letter-spacing:.04em; text-align:center}
footer a{color:var(--ember); text-decoration:none}

@media print{
  body{background:#fff; color:#000}
  .themebtn,.tools,.additem,.del,.mast .aur{display:none !important}
  .sec,.bar,.sec .sbar{border-color:#bbb}
  li{break-inside:avoid}
  li .box{border-color:#666}
  li.done .box{background:#666}
}


/* FUKITLETSGO road-trip theme, matched to index.html */
body{background:var(--mist);color:var(--bitumen);font-family:var(--sans);}
.mast, header.mast{background:linear-gradient(160deg,var(--sign-green) 0%,var(--sign-green-deep) 100%);color:#fff;border-bottom:6px solid var(--gold);}
.mast .aur, header.mast .aur{background:radial-gradient(60% 80% at 20% 0%, rgba(255,255,255,.14), transparent 60%),radial-gradient(50% 80% at 82% 12%, rgba(211,164,92,.16), transparent 60%);}
.eyebrow{font-family:var(--mono);font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold)!important;}
h1,h1.title,.card h3,.panel h2,.kcard h3,.sec>h2,.ev .nm{font-family:var(--serif);font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
h1 .it,h1 .go{color:var(--gold)!important;}
.route,.sub{color:rgba(255,255,255,.84)!important;}
.route b{color:#fff!important;}
.themebtn{top:18px;right:16px;border:1.5px solid rgba(255,255,255,.45);background:rgba(255,255,255,.12);color:#fff;font-family:var(--mono);font-weight:600;text-transform:uppercase;}
.themebtn:hover{border-color:var(--gold);}
.tab,.chip,.btn,.tbtn,a.gmap,.kcard .lk,.ev .event-link,.mapresults .m-focus{font-family:var(--mono);font-weight:600;text-transform:uppercase;letter-spacing:.08em;border-radius:999px;}
.tab[aria-selected="true"],.btn.ember,.chip[data-type="mine"][aria-pressed="true"]{background:var(--sign-green);border-color:var(--sign-green);color:#fff;}
.card,.panel,.kcard,.sec,.ev,.mapdetail,.mapwrap,.map-side,.mapresults .mcard,.gauge,.di,.slpill{background:var(--card);border-color:var(--line);box-shadow:0 1px 3px rgba(38,40,31,.07);}
.tabs{background:linear-gradient(var(--mist) 70%, transparent);}
.card:hover{border-color:var(--sign-green);}
.tag,.fee,.fp,.detour{font-family:var(--mono);font-weight:600;}
input.search,select.reg,select.day,.addform input,.addform select,.addform textarea,.di textarea,.additem input{background:var(--card);color:var(--bitumen);border-color:var(--line);}
input.search:focus,select.reg:focus,select.day:focus,.additem input:focus{outline:none;border-color:var(--sign-green);}
a.gmap,.kcard .lk,.ev .event-link{color:var(--river);}
.leaflet-popup-content-wrapper,.leaflet-popup-tip,.leaflet-bar a,.leaflet-control-layers{background:var(--card)!important;color:var(--bitumen)!important;border-color:var(--line)!important;}
html[data-theme="dark"] .mast,html[data-theme="dark"] header.mast{box-shadow:inset 0 -1px 0 rgba(255,255,255,.06);}
html[data-theme="dark"] .range path:nth-of-type(1){fill:#102235;}
html[data-theme="dark"] .range path:nth-of-type(2){fill:#0d1721;}
html[data-theme="dark"] .range g{fill:#eaf0f3;}
html[data-theme="dark"] .card,html[data-theme="dark"] .panel,html[data-theme="dark"] .kcard,html[data-theme="dark"] .sec,html[data-theme="dark"] .ev,html[data-theme="dark"] .mapdetail,html[data-theme="dark"] .mapwrap,html[data-theme="dark"] .map-side,html[data-theme="dark"] .mapresults .mcard,html[data-theme="dark"] .gauge,html[data-theme="dark"] .di,html[data-theme="dark"] .slpill{box-shadow:0 1px 3px rgba(0,0,0,.22);}
html[data-theme="dark"] .route,html[data-theme="dark"] .sub{color:rgba(234,240,243,.82)!important;}


/* Align the packing-page masthead with the checklist content */
.mast > .eyebrow,
.mast > h1,
.mast > .sub,
.mast > .legd{
  max-width:860px;
  margin-left:auto;
  margin-right:auto;
}
.mast > h1{margin-top:8px;}
.mast > .sub{margin-top:12px;}
.mast > .legd{margin-top:14px;}
@media(max-width:560px){.mast{padding-left:18px;padding-right:18px}.themebtn{top:14px;right:14px}}



/* === FUKITLETSGO shared logo + hamburger menu === */
.flg-nav{position:sticky;top:0;z-index:5000;background:linear-gradient(160deg,var(--sign-green) 0%,var(--sign-green-deep) 100%);border-bottom:3px solid var(--gold);box-shadow:0 6px 18px rgba(0,0,0,.16)}
.flg-nav-inner{max-width:860px;margin:0 auto;padding:8px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.flg-brand{display:inline-flex;align-items:center;gap:9px;color:#fff;text-decoration:none;min-width:0}
.flg-logo{width:38px;height:38px;border-radius:11px;object-fit:cover;border:2px solid rgba(255,255,255,.85);background:rgba(255,255,255,.12);box-shadow:0 2px 10px rgba(0,0,0,.20)}
.flg-word{font-family:var(--mono);font-size:16px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;line-height:1;white-space:nowrap;color:#fff}
.flg-word small{display:block;margin-top:3px;font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.19em;color:var(--gold)}
.flg-menu-wrap{position:relative;display:flex;align-items:center;gap:8px}
.flg-menu-btn{appearance:none;border:1px solid rgba(255,255,255,.32);background:rgba(255,255,255,.10);color:#fff;border-radius:999px;min-width:42px;height:38px;padding:0 12px;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.flg-menu-btn:hover,.flg-menu-btn[aria-expanded="true"]{background:rgba(255,255,255,.18);border-color:var(--gold)}
.flg-menu-icon{width:18px;height:12px;position:relative;display:inline-block}
.flg-menu-icon i,.flg-menu-icon:before,.flg-menu-icon:after{content:"";position:absolute;left:0;right:0;height:2px;background:#fff;border-radius:2px;transition:transform .16s ease,opacity .16s ease,top .16s ease}
.flg-menu-icon:before{top:0}.flg-menu-icon i{top:5px}.flg-menu-icon:after{top:10px}
.flg-menu-btn[aria-expanded="true"] .flg-menu-icon:before{top:5px;transform:rotate(45deg)}
.flg-menu-btn[aria-expanded="true"] .flg-menu-icon i{opacity:0}
.flg-menu-btn[aria-expanded="true"] .flg-menu-icon:after{top:5px;transform:rotate(-45deg)}
.flg-menu{position:absolute;right:0;top:calc(100% + 10px);width:min(88vw,330px);background:var(--surface);color:var(--frost);border:1px solid var(--line-soft);border-radius:14px;box-shadow:0 16px 40px rgba(0,0,0,.30);padding:8px;display:none}
.flg-menu.open{display:block}
.flg-menu a{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:11px 12px;border-radius:10px;color:var(--frost);text-decoration:none;font-family:var(--sans);font-weight:700;font-size:14px}
.flg-menu a span{display:block;grid-column:1 / -1;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);font-weight:700;margin-top:1px}
.flg-menu a:hover{background:var(--surface-hi)}
.flg-menu a[aria-current="page"]{background:rgba(211,164,92,.16);color:var(--ember)}
.flg-menu a[aria-current="page"] span{color:var(--ember)}
.flg-menu .ext{font-size:13px;color:var(--gold)}
@media(max-width:560px){.flg-word{font-size:14px;letter-spacing:.055em}.flg-word small{font-size:9px}.flg-menu-btn .flg-menu-label{display:none}.flg-nav-inner{padding:7px 10px}.flg-logo{width:34px;height:34px}}
@media print{.flg-nav{display:none!important}}
@media(prefers-reduced-motion:reduce){.flg-menu-icon i,.flg-menu-icon:before,.flg-menu-icon:after{transition:none!important}}
.tabs{top:56px!important}
</style>
</head>

<script>
(function(){
  const id = new URLSearchParams(location.search).get('id');
  const r = RECIPES.find(x => x.id === id) || RECIPES[0];
  if (!r) return;

  document.title = r.title + ' — FUKITLETSGO Recipes';
  document.getElementById('cat').textContent = r.category.toLowerCase() + '!';

  const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

  document.getElementById('main').innerHTML =
    '<div class="titleband">' +
      '<h2 class="recipe-title">' + esc(r.title) + '</h2>' +
      '<p class="desc">' + esc(r.description) + '</p>' +
    '</div>' +
    '<div class="pills">' +
      r.diet.map(d => '<span class="pill diet">' + esc(d) + '</span>').join('') +
      r.meta.map(m => '<span class="pill meta">' + esc(m) + '</span>').join('') +
    '</div>' +
    '<div class="cols">' +
      '<div class="ingredients"><h3>Ingredients</h3><ul>' +
        r.ingredients.map(i =>
          '<li>' + (i.amt ? '<span class="amt">' + esc(i.amt) + '</span> ' : '') + esc(i.item) + '</li>'
        ).join('') +
      '</ul></div>' +
      '<div class="method"><h3>Method</h3><ol>' +
        r.steps.map(s =>
          '<li><span class="num"></span><div class="steptext">' +
          '<span class="steptitle">' + esc(s.title) + '</span>' + esc(s.text) + '</div></li>'
        ).join('') +
      '</ol>' +
      (r.notes ? '<div class="notes"><h4>van-life notes —</h4><p>' + esc(r.notes) + '</p></div>' : '') +
      '<div class="actions">' +
        '<button class="btn btn-print" onclick="window.print()">Print / Save as PDF</button>' +
        '<a class="btn btn-back" href="index.html">← All recipes</a>' +
      '</div>' +
      '</div>' +
    '</div>';
})();
</script>

<script>
(function(){
  var nav=document.querySelector('.flg-nav'); if(!nav) return;
  var btn=nav.querySelector('.flg-menu-btn');
  var menu=nav.querySelector('.flg-menu');
  if(!btn || !menu) return;
  var page=nav.getAttribute('data-page')||'';
  var active=menu.querySelector('a[data-page="'+page+'"]');
  if(active) active.setAttribute('aria-current','page');
  function setOpen(open){
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    menu.classList.toggle('open', !!open);
  }
  btn.addEventListener('click',function(e){e.stopPropagation();setOpen(btn.getAttribute('aria-expanded')!=='true');});
  menu.addEventListener('click',function(e){e.stopPropagation();});
  document.addEventListener('click',function(){setOpen(false);});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')setOpen(false);});
})();
</script>
