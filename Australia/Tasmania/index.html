    { id: 'freycinet', r: 4, t: 'marquee', mine: 1, n: 'Freycinet & Wineglass Bay', b: "The Hazards' pink-granite peaks over the perfect curve of Wineglass Bay. The lookout walk is short and steep; in winter you may have it to yourself." },
    { id: 'hazardscircuit', r: 4, t: 'hidden', mine: 1, n: 'Hazards Beach Circuit', b: "The fuller Freycinet loop — over the saddle to Wineglass Bay, along the sand and back via Hazards Beach. A big half-day on the legs.", tip: "Roughly 4–5 hours; check timing against short winter daylight." },
    { id: 'kelvedon', r: 4, t: 'hidden', mine: 1, n: 'Kelvedon Beach boatshed', b: "The much-photographed old boatshed on Kelvedon Beach near Swansea, with Freycinet across the water. Best in soft early or late light.", tip: "Reading your 'Kalvedon' as Kelvedon." },
    { id: 'maria', r: 4, t: 'marquee', mine: 1, n: 'Maria Island', b: "A car-free island off Triabunna — convict ruins at Darlington, the swirled Painted Cliffs, fearless wombats, and brilliant flat cycling.", tip: "Day-trip by passenger ferry; bring the bikes — no vehicles on the island." },
    { id: 'bicheno', r: 4, t: 'marquee', n: 'Bicheno', b: "A blowhole that fires on the right swell, little penguins coming ashore at dusk, and Bicheno Beams lighting the town through the dark months.", tip: "Penguin tours and Beams run set nights — check dates." },
    { id: 'spiky', r: 4, t: 'hidden', n: 'Spiky Bridge', b: "A convict-built bridge bristling with vertical stones — nobody's quite sure why. A quick, strange roadside stop south of Swansea." },
    { id: 'lisdillon', r: 4, t: 'hidden', n: 'Lisdillon Saltworks', b: "Crumbling 19th-century saltworks ruins above Great Oyster Bay — sun-bleached stone, big views, and almost no one." },
    { id: 'bushgardens', r: 4, t: 'hidden', n: 'Tasmanian Bushland Gardens', b: "A volunteer-built native garden south of Orford — eucalypts, orchids and banksias, a living scrapbook of the island's flora." },
    // Midlands
    { id: 'ross', r: 9, t: 'hidden', n: 'Ross', b: "A midlands village built by convicts in the 1830s — its carved sandstone bridge is among the oldest in Australia, and the bakery is a reason in itself.", van: "Easy main-street stop on the Midland Highway." },
    { id: 'campbelltown', r: 9, t: 'hidden', mine: 1, n: 'Campbell Town', b: "A Georgian midlands town on the highway — the convict-built Red Bridge and a paving 'brick trail', each brick naming a transported convict." },
    // Hobart & Surrounds
    { id: 'mona', r: 5, t: 'marquee', mine: 1, n: 'MONA', b: "David Walsh's subterranean 'subversive adult Disneyland' — confronting, funny, unforgettable. Take the ferry up the Derwent to arrive properly.", tip: "Closed some weekdays in winter — check opening days." },
    { id: 'kunanyi', r: 5, t: 'marquee', n: 'kunanyi / Mt Wellington', b: "1,271 m straight above the city, often under snow in July — drive (or be driven) to the summit for views to the Southern Ocean.", van: "Don't take the van up — steep, narrow and ices over. Leave it in town.", tip: "The road closes for snow/ice; check the gate status." },
    { id: 'salamanca', r: 5, t: 'food', mine: 1, n: 'Salamanca Market', when: "Saturdays", b: "Hundreds of stalls along the sandstone warehouses every Saturday morning — produce, makers and hot food, rain, shine or sleet.", tip: "Plan a Saturday in Hobart around this." },
    { id: 'voices', r: 5, t: 'event', n: 'Festival of Voices', when: "Early–mid July", b: "Australia's big celebration of the voice — choirs filling Hobart's halls, churches, pubs and street corners, capped by a fire-lit night.", tip: "Confirm 2026 dates." , url:'https://festivalofvoices.com/'},
    { id: 'beaker', r: 5, t: 'event', n: 'Beaker Street Festival', when: "Mid August", b: "A genuinely quirky science-and-art festival — glowing flora-and-fauna tours, dark-sky nights and the hunt for the Aurora Australis with actual scientists.", tip: "Confirm 2026 dates." , url:'https://www.beakerstreet.com.au/festival/'},
    { id: 'whisky', r: 5, t: 'event', n: 'Tasmanian Whisky Week', when: "Early August", b: "A week of tastings and stories across the island's distilleries, north and south. Just don't drive on the good stuff." , url:'https://www.taswhiskyweek.com/'},
    { id: 'bonorong', r: 5, t: 'marquee', n: 'Bonorong Wildlife Sanctuary', b: "A rescue sanctuary north of Hobart — close-up devils, wombats and quolls, with night feeding tours and hand-feeding roos in the frost." },
    { id: 'richmond', r: 5, t: 'hidden', mine: 1, n: 'Richmond & the Pooseum', b: "Australia's oldest road bridge, a convict gaol, a Georgian village — and, yes, the Pooseum, a whole museum of animal droppings. Half an hour from Hobart." },
    { id: 'mtfield', r: 5, t: 'marquee', mine: 1, n: 'Mount Field — Russell Falls', b: "Russell Falls — tiered rainforest falls on an easy, pram-flat stroll from the car park — plus towering swamp gums and snow up at Lake Dobson." },
    { id: 'cascadebrewery', r: 5, t: 'drink', mine: 1, n: 'Cascade Brewery', b: "Australia's oldest continually operating brewery, in a grand Gothic building below kunanyi — tours and tastings in South Hobart." },
    { id: 'femalefactory', r: 5, t: 'marquee', mine: 1, n: 'Cascades Female Factory', b: "A World-Heritage convict site that tells the women's side of the story. Spare, moving, and powerfully done — guided tours bring it to life." },
    { id: 'sparkle', r: 5, t: 'hidden', mine: 1, n: 'Sea sparkle (bioluminescence)', b: "Bioluminescent plankton that lights the water electric-blue on dark, still nights, often around southern Hobart beaches.", tip: "Reading your 'sparkly water' as this — needs a dark, moonless night and luck. Check local sightings pages, or tell me if you meant a named place." },
    // Bruny & the Huon
    { id: 'bruny', r: 6, t: 'marquee', mine: 1, n: 'Bruny Island', b: "Cross by ferry to oysters, cheese, whisky and the wind-blasted Neck lookout — two islands joined by a sandspit, a lighthouse at the far south.", van: "The vehicle ferry takes caravans (priced by length); some island roads are unsealed." },
    { id: 'huonfest', r: 6, t: 'event', n: 'Huon Valley Mid-Winter Festival', when: "Mid July", b: "A pagan-flavoured apple-country knees-up at Willie Smith's Apple Shed near Huonville — cider, wassailing, fire and a fair bit of costume.", tip: "The original Mid-Winter Festival has changed over time — check Willie Smith’s current Apple Shed events before you plan around it." , url:'https://www.williesmiths.com.au/Apple-shed'},
    { id: 'tahune', r: 6, t: 'marquee', n: 'Tahune Airwalk', b: "A steel walkway out over the Huon and Picton rivers, high in the canopy — cantilevered ends that bounce gently above the confluence." },
    { id: 'hastings', r: 6, t: 'hidden', n: 'Hastings Caves & Thermal Springs', b: "A grand dolomite cave, then a warm thermal pool in the forest — the one place in Tasmania where winter swimming actually makes sense." },
    { id: 'cockle', r: 6, t: 'hidden', mine: 1, n: 'Cockle Creek', b: "The southernmost point you can drive to in Australia — the road just runs out at the edge of the wilderness. Bleak, beautiful, the end of the map.", van: "Final stretch is unsealed and remote; check conditions and fuel first." },
    // Tasman & Port Arthur
    { id: 'portarthur', r: 7, t: 'marquee', n: 'Port Arthur Historic Site', b: "Australia's most intact convict settlement, hauntingly beautiful around the harbour — at its eeriest on a grey winter's day. Ghost tours after dark." },
    { id: 'nrmaportarthur', r: 7, t: 'stay', mine: 1, fee: 'PAID', n: 'NRMA Port Arthur Holiday Park', b: "Your Tasman Peninsula base — powered sites handy to the historic site and the coastal walks.", van: "Book ahead even in winter; good base for Cape Raoul and Eaglehawk Neck day trips." },
    { id: 'eaglehawk', r: 7, t: 'marquee', mine: 1, n: 'Eaglehawk Neck', b: "The narrow isthmus onto the Tasman Peninsula and a cluster of coastal drama within minutes — the Tessellated Pavement, Tasman Arch, the Devil's Kitchen and a blowhole." },
    { id: 'tessellated', r: 7, t: 'hidden', n: 'Tessellated Pavement', b: "A flat rock shelf cracked by nature into a near-perfect tiled grid — best at low tide, dawn or dusk." },
    { id: 'tasmanarch', r: 7, t: 'marquee', n: 'Tasman Arch & blowholes', b: "Tasman Arch, the Devil's Kitchen and a blowhole within a few minutes of each other — raw dolerite coast, most dramatic in a winter swell." },
    { id: 'caperaoul', r: 7, t: 'hidden', mine: 1, n: 'Cape Raoul hike', b: "A spectacular Tasman Peninsula day walk out to towering dolerite sea-cliffs, with a seal colony on the rocks below.", tip: "Reading 'Cape rowl' as Cape Raoul — a solid half-day; check the forecast for the exposed clifftops." },
    // West Coast
    { id: 'strahan', r: 8, t: 'marquee', mine: 1, n: 'Strahan & the Gordon River', b: "A tiny harbour town on the wild west — cruise the tannin-dark Gordon River into ancient rainforest and the old penal island of Sarah Island." },
    { id: 'queenstown', r: 8, t: 'marquee', mine: 1, n: 'Queenstown', b: "A copper-mining town ringed by bare, lunar hills stripped by a century of smelting — stark and unforgettable. Ride the West Coast Wilderness Railway out of town." },
    { id: 'gordondam', r: 8, t: 'hidden', n: 'Gordon Dam', b: "A 140 m curved concrete wall holding back a vast hydro lake deep in the south-west — vertigo with a view.", van: "Long sealed dead-end road in from Strathgordon; plan fuel and the return run." },
    { id: 'nelson', r: 8, t: 'hidden', n: 'Nelson Falls', b: "A short, easy rainforest boardwalk off the Lyell Highway to a tall, fern-framed waterfall — an effortless leg-stretch between Queenstown and Derwent Bridge." },
    { id: 'montezuma', r: 8, t: 'hidden', mine: 1, n: 'Montezuma Falls', b: "Tasmania's highest waterfall at the end of an old tramway track near Rosebery — a longer rainforest walk to a swing bridge and a 100 m drop." },

        LMAP = L.map('leafmap', { zoomControl: true, attributionControl: true });
        var sat = L.layerGroup([
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19, attribution: 'Imagery © Esri' }),
            L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', { maxZoom: 19 })
        ]);
        var streets = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap contributors' });
        var terrain = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { maxZoom: 17, attribution: '© OpenStreetMap · © OpenTopoMap (CC-BY-SA)' });
        var night = L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { maxZoom: 19, attribution: '© OpenStreetMap · © CARTO' });
        sat.addTo(LMAP);
        L.control.layers({ 'Satellite': sat, 'Streets': streets, 'Terrain': terrain, 'Night': night }, null, { position: 'topright', collapsed: false }).addTo(LMAP);
        LMAP.fitBounds(TAS_BOUNDS);
        window.addEventListener('resize', function () { if (LMAP) LMAP.invalidateSize(); });
    }
    buildMarkers();
    refreshDetail();
    renderMapResults();
    if (LMAP) setTimeout(function () {
        LMAP.invalidateSize();
        if (!LMAP._didFit) { LMAP.fitBounds(TAS_BOUNDS); LMAP._didFit = true; }
    }, 120);
}
function onMapClick(e) {
    var chip = e.target.closest('#mapChips .chip');
    if (chip) {
        mapFilter = chip.dataset.type;
        Array.prototype.forEach.call(chip.parentNode.children, function (x) { x.setAttribute('aria-pressed', x === chip ? 'true' : 'false'); });
        buildMarkers();
        renderMapResults();
        fitCurrentMapToPlaces();
        refreshDetail();
        return;
    }
    var focus = e.target.closest('[data-map-focus]');
    if (focus) {
        var id = focus.getAttribute('data-map-focus');
        mapSel = id;
        restyleMarkers();
        refreshDetail();
        if (LMAP && MARKERS[id]) {
            LMAP.setView(LL[id], Math.max(LMAP.getZoom(), 11));
            MARKERS[id].openPopup();
        }
        return;
    }
    var da = e.target.closest('#mapDetail [data-act]');
    if (da && mapSel) {
        var act = da.dataset.act, id = mapSel, a = state.assign[id] || {};
        if (act === 'vis') setAssign(id, { visited: !a.visited, in: true });
        else if (act === 'fav') setAssign(id, { fav: !a.fav, in: true });
        restyleMarkers();
        refreshDetail();
        renderMapResults();
    }
}
function onMapChange(e) {
    var reg = e.target.closest('#mapRegion');
    if (reg) {
        buildMarkers();
        renderMapResults();
        fitCurrentMapToPlaces();
        refreshDetail();
        return;
    }
    var day = e.target.closest('#mapDetail [data-act="day"]');
    if (day && mapSel) {
        var v = day.value, id = mapSel;
        if (v === 'none') setAssign(id, { in: false, date: null });
        else if (v === 'shortlist') setAssign(id, { in: true, date: null });
        else setAssign(id, { in: true, date: v });
        restyleMarkers();
        refreshDetail();
        renderMapResults();
    }
}

function showTab(name) {
    var map = { discover: '#view-discover', itin: '#view-itin', map: '#view-map', know: '#view-know' };
    ['discover', 'itin', 'map', 'know'].forEach(function (n) { var tab = $('#tab-' + n), panel = $(map[n]); var on = (n === name); tab.setAttribute('aria-selected', on ? 'true' : 'false'); panel.hidden = !on; });
    if (name === 'itin')
        renderItin();
    if (name === 'map')
        renderMap();
    if (name === 'know')
        renderKnow();
    window.scrollTo(0, 0);
}
function fillRegionSelects() {
    $('#regSel').innerHTML = '<option value="all">All regions</option>' + REGIONS.map(function (r, i) { return '<option value="' + i + '">' + esc(r) + '</option>'; }).join('');
    $('#af-region').innerHTML = REGIONS.map(function (r, i) { return '<option value="' + i + '">' + esc(r) + '</option>'; }).join('');
}
function wireAdd() {
    $('#addToggle').onclick = function () { return $('#addForm').classList.toggle('open'); };
    $('#af-cancel').onclick = function () { return $('#addForm').classList.remove('open'); };
    $('#af-save').onclick = function () {
        var n = $('#af-name').value.trim();
        if (!n) {
            $('#af-name').focus();
            return;
        }
        state.userPlaces.push({ id: 'u' + Date.now(), n: n, r: +$('#af-region').value, t: $('#af-type').value, b: $('#af-blurb').value.trim() });
        save();
        $('#af-name').value = '';
        $('#af-blurb').value = '';
        $('#addForm').classList.remove('open');
        renderDiscover();
    };
}
(function init() {
    fillRegionSelects();
    wireAdd();
    $('#typeChips').addEventListener('click', function (e) {
        var c = e.target.closest('.chip');
        if (!c)
            return;
        filterType = c.dataset.type;
        __spreadArray([], $('#typeChips').children, true).forEach(function (x) { return x.setAttribute('aria-pressed', x === c ? 'true' : 'false'); });
        renderDiscover();
    });
    $('#regSel').addEventListener('change', function (e) { filterReg = e.target.value; renderDiscover(); });
    $('#search').addEventListener('input', function (e) { q = e.target.value.trim().toLowerCase(); renderDiscover(); });
    $('#grid').addEventListener('click', onGridClick);
    $('#grid').addEventListener('touchend', onGridClick);
    $('#grid').addEventListener('change', onGridChange);
    $('#view-itin').addEventListener('click', onItinClick);
    $('#view-itin').addEventListener('touchend', onItinClick);
    $('#view-itin').addEventListener('change', onItinInput);
    $('#view-map').addEventListener('click', onMapClick);
    $('#view-map').addEventListener('change', onMapChange);
    $('#tab-discover').onclick = function () { return showTab('discover'); };
    $('#tab-itin').onclick = function () { return showTab('itin'); };
    $('#tab-map').onclick = function () { return showTab('map'); };
    $('#tab-know').onclick = function () { return showTab('know'); };
    buildReadout();
    renderDiscover();
    try { load(); } catch(e) {} buildReadout(); renderDiscover();
})();

</script>
